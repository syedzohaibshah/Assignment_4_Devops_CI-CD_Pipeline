name: staging workflow 

run-name: >+ 
  CI Pipeline triggered by ${{github.actor}}
  on event':' ${{github.event_name}}
  -> branch':' ${{github.ref_name}}
  for repository':' ${{github.repository}}


on:
  push:
    branches:
      - main

  workflow-dispatch:


jobs:
  frontend:
    runs-on:ubuntu-latest
    steps:
      - name:checkout
        uses:actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version:24
      - run: cd frontend && npm install
      - run: cd frontend && npm run lint -- --fix
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test -- --watchAll=false
      - run: cd frontend && np run build
      - uses: actions/upload-artifact@v4
        with: 
          path: frontend/build/
   

  backend:
    runs-on:ubuntu-latest
    steps:
      - name: checkout
        uses:actions/checkout@v4
      - uses: actions/setup-node@v4 
        with:
          node-version:24
      - run: cd backend  && npm install
      - run: cd backend && node --check server.js
      
       
