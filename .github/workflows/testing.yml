name: CICD Pipeline for tsting React APP A4

run-name: >+
  CI Pipeline triggered by ${{github.actor}}
  on event':' ${{github.event_name}}
  -> branch':' ${{github.ref_name}}
  for repository':' ${{github.repository}}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: cd frontend && npm install

      - name: Linting
        run: cd frontend && npm run lint

      - name: Run Unit Tests
        run: cd frontend && npm test -- --watchAll=false

      - name: Build Application
        run: cd frontend && CI=false npm run build

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

  test-backend:
    name: Test Backend Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Check Backend Syntax
        working-directory: ./backend
        run: node --check server.js

  deploy-on-AWS-EC2-Instance:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    environment:
      name: ec2-end-url
      url: ${{ steps.set-url.outputs.page_url }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{vars.EC2_HOST}}
          username: ${{vars.EC2_USER}}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/Assignment_4_Devops_CI-CD_Pipeline

            # Stop existing services
            pm2 stop backend 2>/dev/null || true
            pm2 delete backend 2>/dev/null || true
            docker-compose -f postgres-compose.yml down -v 2>/dev/null || true

            # Force remove old postgres container if it exists
            docker rm -f notes_postgres 2>/dev/null || true
            docker rm -f notes_db 2>/dev/null || true

            # Pull latest code
            git pull origin main

            # Start PostgreSQL with docker-compose
            docker-compose -f postgres-compose.yml up -d
            sleep 10

            # Backend setup
            cd backend
            npm install
            pm2 start server.js --name backend
            cd ..

            # Frontend deployment
            sudo chown ubuntu:ubuntu /var/www/html
            sudo chmod 755 /var/www/html
            rm -rf /var/www/html/*
            cp -r frontend/build/* /var/www/html/
            sudo systemctl restart apache2

      - name: Set Deployment URL
        id: set-url
        run: echo "page_url=http://${{ vars.EC2_HOST }}" >> $GITHUB_OUTPUT

      - name: Send Success Email to QA
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{secrets.SMTP_HOST}}
          server_port: 587
          username: ${{secrets.SMTP_USERNAME}}
          password: ${{secrets.SMTP_PASSWORD}}
          subject: "Deployment Successful - Ready for QA Testing"
          to: ${{secrets.QA_EMAIL}}
          from: "GitHub Actions"
          body: |
            Deployment successful!

            Access: http://${{ vars.EC2_HOST }}
            Author: ${{ github.actor }}
            PR #: ${{ github.event.pull_request.number }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{secrets.SMTP_HOST}}
          server_port: 587
          username: ${{secrets.SMTP_USERNAME}}
          password: ${{secrets.SMTP_PASSWORD}}
          subject: "Workflow Failed"
          to: ${{secrets.QA_EMAIL}}
          from: "GitHub Actions"
          body: |
            Workflow failed!

            Author: ${{ github.actor }}
            PR #: ${{ github.event.pull_request.number }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
